title: "TYLER COX"
description: Senior software engineer building full-stack applications, platform tooling, observability, and game systems.
tagline: Senior Software Engineer
# Use the Chirpy theme
theme: jekyll-theme-chirpy
markdown: kramdown
url: https://ty-lercox.github.io
baseurl: /portfolio
plugins:
  - jekyll-include-cache
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-seo-tag
exclude:
  - jekyll-theme-chirpy-master
  - output
  - resume-json
  - resume-old
  - scripts
  - ats_prompts
  - dice_automation
  - 404.md
  - robots.txt
  - apply.py
  - job.txt
  - generate_ats_prompt.py
  - reset_git_history.py
  - run.bat
collections:
  tabs:
    output: true
    sort_by: order
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/
  - scope:
      path: ""
    values:
      layout: default
# (Optional) SEO/social hints
social:
  name: "KEVIN 'TYLER' COX"
  email: kevincox103@gmail.com
  links:
    - https://github.com/Ty-lerCox
    - https://linkedin.com/in/tyler-cox-1715065a/
    - https://ty-lercox.github.io/portfolio/
theme_mode: dark

# Leave the avatar empty until a current professional headshot is available.
avatar: ""

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
analytics:
  google:
    id: G-22H4J8JQGP
